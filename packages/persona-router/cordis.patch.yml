# dsh-superagent-persona-router bundle layer: inserts the routing plugin after the Super-agent in the profile layer.
# The plugin registers a PersonaRouter on the Super-agent's optional `orchestrator.persona` registry; when that
# registry is absent (an older Super-agent) it logs and stays inert, so native behavior is unchanged.
#
# The profile layer configures this entry by id, for example:
#   - id: dsh-superagent-persona-router
#     config:
#       mode: rules
#       overridesPath: /absolute/path/to/persona-overrides.json
# See README.md for the config schema.
- insert:
    - id: dsh-superagent-persona-router
      name: dsh-superagent-persona-router
