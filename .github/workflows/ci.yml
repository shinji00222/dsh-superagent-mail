name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build the plugin and the routing Bundle
        run: pnpm build

      # The upstream full suite needs POSIX tools and a display-less jsdom setup it is not tuned for
      # on CI; the fork's gates are the Persona feature tests plus the core domain suite they touch.
      - name: Feature and core tests
        run: >-
          pnpm exec vitest run
          tests/mail.spec.ts
          tests/mail-providers.spec.ts
          tests/persona-binding.spec.ts
          tests/persona-injection.spec.ts
          tests/persona-router.spec.ts
          tests/core-engine.spec.ts
          tests/stage.spec.ts
          tests/runtime.spec.ts
        env:
          E2E_SKIP: '1'

      - name: Pack the routing Bundle
        run: pnpm --dir packages/persona-router pack --pack-destination "$RUNNER_TEMP"
